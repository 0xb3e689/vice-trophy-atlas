<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Trophy Atlas · GTA VI trophy guide &amp; tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="main.js">
</head>
<body data-tab="tracker">
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">VTA</span><div><h1>Vice Trophy Atlas</h1><p>GTA VI · PS5 · 55 trophies</p></div></div>
  <div class="tally"><span id="earned">0 / 55</span><span class="meter"><i id="earned-bar"></i></span><small>earned</small></div>
  <div id="grades" class="grades"></div>
  <label class="shield-toggle"><input id="spoiler" type="checkbox" checked> Spoiler shield</label>
  <button id="export" type="button">Export</button>
  <label class="import-btn">Import<input id="import" type="file" accept="application/json,.json"></label>
  <small id="saved-note">saved in this browser</small>
</header>
<div id="audit" class="audit"></div>
<nav class="tabs">
  <button type="button" data-tab="tracker">Tracker</button>
  <button type="button" data-tab="roadmap">Roadmap</button>
  <button type="button" data-tab="missables">Missables</button>
  <button type="button" data-tab="sources">Sources</button>
</nav>
<main id="tracker" class="cols">
  <aside class="col-left"><div id="filters"></div><div id="checklist" class="checklist"></div></aside>
  <section id="detail" class="col-mid"></section>
  <aside id="side" class="col-right"></aside>
</main>
<main id="page" class="page"></main>
<script type="module" src="main.js"></script>
</body>
</html>
